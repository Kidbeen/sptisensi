<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensiFlow AI 2026 - Oficial</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #0f0f1f; color: white; text-align: center; padding: 20px; }
        .container { max-width: 400px; margin: auto; background: #1a1a2e; padding: 20px; border-radius: 15px; border: 2px solid #e94560; box-shadow: 0 0 20px rgba(233, 69, 96, 0.3); }
        h1 { color: #e94560; font-size: 24px; }
        select, input, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { background: #e94560; color: white; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button:hover { background: #ff2e63; transform: scale(1.02); }
        .result { background: #16213e; padding: 15px; border-radius: 10px; margin-top: 20px; text-align: left; display: none; border-left: 4px solid #00d2ff; }
        .val { color: #00d2ff; font-weight: bold; float: right; }
    </style>
</head>
<body>

<div class="container">
    <h1>SensiFlow AI 🤖</h1>
    <p>Calibração de Precisão (Escala 200)</p>
    
    <input type="text" id="phone" placeholder="Modelo do Celular (Ex: S23 Ultra)">
    
    <select id="style">
        <option value="baixa">Sensibilidade Baixa (Precisão)</option>
        <option value="media">Sensibilidade Média (Equilibrada)</option>
        <option value="alta">Sensibilidade Alta (Velocidade)</option>
    </select>

    <button onclick="generateSensi()">GERAR NOVA CALIBRAÇÃO</button>

    <div id="result" class="result">
        <p>Geral: <span id="r-geral" class="val">0</span></p>
        <p>Ponto Vermelho: <span id="r-red" class="val">0</span></p>
        <p>Mira 2x: <span id="r-2x" class="val">0</span></p>
        <p>Mira 4x: <span id="r-4x" class="val">0</span></p>
        <p>Botão de Atirar: <span id="r-btn" class="val">0</span></p>
        <hr style="border: 0.5px solid #333;">
        <p style="font-size: 12px; color: #888;">*IA Calibrada para o servidor atual.*</p>
    </div>
</div>

<script>
function generateSensi() {
    const style = document.getElementById('style').value;
    let base;

    if(style === 'baixa') base = 90;
    else if(style === 'media') base = 135;
    else base = 175;

    // Lógica de Variabilidade SensiFlow (Sempre gera algo novo +-5)
    const randomShift = () => Math.floor(Math.random() * 11) - 5;

    document.getElementById('r-geral').innerText = base + randomShift();
    document.getElementById('r-red').innerText = (base - 10) + randomShift();
    document.getElementById('r-2x').innerText = (base - 5) + randomShift();
    document.getElementById('r-4x').innerText = (base + 5) + randomShift();
    document.getElementById('r-btn').innerText = Math.floor(Math.random() * (55 - 40 + 1)) + 40 + "%";

    document.getElementById('result').style.display = 'block';
}
</script>

</body>
    </html>
