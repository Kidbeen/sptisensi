<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linx 7s - FFH4X Edition</title>
    <style>
        /* FONTE GOMER (VIBE XIT FFH4X) */
        @import url('https://fonts.googleapis.com/css2?family=Anton&display=swap');

        :root { --red: #ff0000; --dark-red: #8b0000; --bg: #050505; --neon-red: 0 0 15px #ff0000; }
        body { background: #000; color: #fff; font-family: 'Anton', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; overflow: hidden; }
        
        /* CONTAINER MESTRE (VIBE FFH4X) */
        .box { width: 330px; background: var(--bg); border: 3px solid var(--red); border-radius: 10px; box-shadow: var(--neon-red); overflow: hidden; transition: 0.5s; position: relative; }
        
        /* Detalhe de Fundo (Simula XIT) */
        .box::after { content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%; background: repeating-linear-gradient(45deg, rgba(255,0,0,0.05) 0px, rgba(255,0,0,0.05) 2px, transparent 2px, transparent 10px); z-index: -1; }

        /* TELA DE LOGIN */
        #login-div { padding: 30px; text-align: center; }
        .logo-xit { color: var(--red); font-size: 28px; text-transform: uppercase; text-shadow: var(--neon-red); margin-bottom: 25px; letter-spacing: 2px; }
        input { width: 85%; padding: 12px; margin: 12px 0; background: #0a0a0a; border: 2px solid var(--dark-red); color: #fff; border-radius: 5px; text-align: center; font-family: sans-serif; outline: none; }
        input:focus { border-color: var(--red); box-shadow: 0 0 5px var(--red); }
        .btn-auth { width: 95%; padding: 12px; background: linear-gradient(to bottom, var(--red), var(--dark-red)); border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; margin-top: 15px; font-family: 'Anton', sans-serif; letter-spacing: 1px; }

        /* PAINEL DE FUNÇÕES */
        #panel-div { display: none; padding: 0; }
        .panel-header { background: linear-gradient(to right, var(--dark-red), var(--red)); color: #fff; padding: 12px; text-align: center; font-weight: bold; font-size: 14px; text-transform: uppercase; text-shadow: 0 0 5px #000; border-bottom: 2px solid #000; }
        
        .panel-body { padding: 15px; max-height: 480px; overflow-y: auto; }
        .func-card { background: rgba(10,10,10,0.9); padding: 12px; border-radius: 8px; margin-bottom: 15px; border: 1px solid var(--dark-red); border-left: 5px solid var(--red); position: relative; }
        .func-title { font-size: 11px; color: var(--red); font-weight: bold; margin-bottom: 10px; text-transform: uppercase; text-shadow: 0 0 3px rgba(255,0,0,0.5); }

        select { width: 100%; background: #000; color: #fff; border: 1px solid #222; padding: 8px; border-radius: 4px; font-size: 12px; font-family: sans-serif; outline: none; }
        select:focus { border-color: var(--red); }
        
        /* BOTÃO DE INJETAR (ESTILO FFH4X) */
        .btn-inject { width: 100%; padding: 18px; background: linear-gradient(to bottom, #ff0000, #aa0000); border: 2px solid #fff; color: #fff; font-weight: bold; border-radius: 10px; cursor: pointer; text-transform: uppercase; font-family: 'Anton', sans-serif; font-size: 14px; letter-spacing: 2px; box-shadow: 0 0 15px rgba(255,0,0,0.4); transition: 0.3s; }
        .btn-inject:hover { box-shadow: 0 0 25px rgba(255,0,0,0.8); transform: scale(1.02); }
        .btn-inject:active { transform: scale(0.98); }

        #log-text { font-size: 10px; color: #555; text-align: center; margin-top: 15px; font-family: monospace; }
        .footer { font-size: 9px; color: #333; text-align: center; padding: 10px; border-top: 1px solid #111; font-family: sans-serif; }
    </style>
</head>
<body>

    <div class="box" id="mainBox">
        <div id="login-div">
            <div class="logo-xit">LINX 7S</div>
            <p style="font-size: 9px; color: #555; margin-top: -20px; text-transform: uppercase; font-family: sans-serif;">FFH4X Private v13.0</p>
            <input type="text" id="userInput" placeholder="USUÁRIO">
            <input type="password" id="keyInput" placeholder="KEY DE ACESSO">
            <button class="btn-auth" onclick="entrar()">DESBLOQUEAR PAINEL</button>
        </div>

        <div id="panel-div">
            <div class="panel-header">▼ LINX 7S ULTIMATE (BY MÉRCIO)</div>
            <div class="panel-body">
                
                <div class="func-card">
                    <div class="func-title">🎯 COMBAT SETTINGS (AIMBOT)</div>
                    <select id="aimType">
                        <option value="auto">Aimbot Auto (100% Legit)</option>
                        <option value="fov">Aim FOV (360° Rage)</option>
                    </select>
                </div>

                <div class="func-card">
                    <div class="func-title">🔥 SMART CALIBRATION (TARGET)</div>
                    <select id="targetBody">
                        <option value="head">Cabeça (Headshot)</option>
                        <option value="neck">Pescoço (Estável)</option>
                        <option value="chest">Peito (Legit Capa)</option>
                        <option value="feet">Pé (Troll/Fix)</option>
                    </select>
                </div>

                <div class="func-card">
                    <div class="func-title">👁️ VISUALS (ESP)</div>
                    <select>
                        <option>ESP Linha (Skeletal)</option>
                        <option>ESP Box</option>
                    </select>
                </div>

                <div class="func-card" style="border-left-color: #fff;">
                    <div class="func-title">🛡️ SEGURANÇA</div>
                    <div style="display: flex; justify-content: space-between; font-size: 11px; color: #fff;">
                        <span>Anti-Ban v13.0 Stealth</span>
                        <span style="color: var(--neon); font-weight: bold; text-shadow: 0 0 5px var(--red);">ON</span>
                    </div>
                </div>

                <button class="btn-inject" onclick="injetar()">▶ INJETAR & ABRIR FF</button>
                <div id="log-text">Aguardando comando do Mércio...</div>
            </div>
            <div class="footer">FFH4X Style Private - Maputo 2026</div>
        </div>
    </div>

    <script>
        // CONFIGURAÇÃO DO DONO
        const USER_VIP = "mercio";
        const KEY_VIP = "12345";

        function entrar() {
            const u = document.getElementById('userInput').value;
            const k = document.getElementById('keyInput').value;

            if(u === USER_VIP && k === KEY_VIP) {
                // TROCA DE TELA
                document.getElementById('login-div').style.display = 'none';
                document.getElementById('panel-div').style.display = 'block';
            } else {
                alert("ACESSO NEGADO! Verifique os dados.");
            }
        }

        function injetar() {
            const log = document.getElementById('log-text');
            const target = document.getElementById('targetBody').value;

            log.innerText = "> INICIANDO INJEÇÃO DE SCRIPTS...";
            log.style.color = "var(--red)";

            setTimeout(() => {
                log.innerText = "> CALIBRADO PARA: " + target.toUpperCase();
                log.style.color = "#ff8080"; // Vermelho claro

                setTimeout(() => {
                    log.innerText = "> SCRIPT INJETADO COM SUCESSO!";
                    log.style.color = "#ff0000"; // Vermelho Puro

                    setTimeout(() => {
                        // ABRE O FREE FIRE
                        window.location.href = "intent://#Intent;package=com.dts.freefireth;scheme=android-app;end";
                    }, 1200);
                }, 1500);
            }, 2000);
        }
    </script>
</body>
</html>
