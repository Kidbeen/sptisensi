<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linx 7s Pioneiro - v8.0 Black Edition</title>
    <style>
        :root { --purple: #8a2be2; --cyan: #00f2ff; --dark: #0a0a0a; --neon-g: #39ff14; }
        body { background: #000; color: #fff; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        
        /* O Container Principal */
        .painel-container { width: 340px; background: var(--dark); border: 2px solid var(--purple); border-radius: 10px; display: flex; flex-direction: column; box-shadow: 0 0 25px rgba(138, 43, 226, 0.4); }
        
        /* Barra de Título */
        .header { background: var(--purple); padding: 8px; font-size: 11px; display: flex; justify-content: center; font-weight: bold; border-radius: 8px 8px 0 0; }
        
        /* Módulo de Funções */
        .main-content { padding: 20px; font-size: 13px; }
        .module { background: #151515; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid #222; border-left: 3px solid var(--cyan); }
        .module-title { color: var(--cyan); font-size: 10px; text-transform: uppercase; margin-bottom: 8px; font-weight: bold; }

        .row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        select { background: #000; color: #fff; border: 1px solid #333; padding: 5px; border-radius: 5px; font-size: 11px; }

        /* Módulos de Segurança */
        .security-box { border: 1px solid var(--neon-g); padding: 10px; border-radius: 8px; margin-top: 15px; background: rgba(5, 21, 5, 0.8); }
        .security-title { color: var(--neon-g); font-size: 9px; font-weight: bold; margin-bottom: 5px; }

        /* Botão Iniciar */
        .btn-start { width: 100%; padding: 15px; background: transparent; border: 2px solid var(--cyan); color: var(--cyan); font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 8px; transition: 0.3s; }
        .btn-start:hover { background: var(--cyan); color: #000; box-shadow: 0 0 15px var(--cyan); }

        #status-console { font-size: 10px; color: #666; text-align: center; margin-top: 15px; font-family: monospace; }
        .credits { font-size: 8px; color: rgba(255, 255, 255, 0.4); text-align: center; padding: 8px; border-top: 1px solid #1a1a1a; margin-top: 10px; }
    </style>
</head>
<body>

<div class="painel-container">
    <div class="header">▼ LINX 7S PIONEIRO (CRIADO POR MÉRCIO) v8.0</div>

    <div class="main-content">
        <div class="module">
            <div class="module-title">🎯 SMART CALIBRATION (Capa Fácil)</div>
            <div class="row">
                <span>Comportamento Atual:</span>
                <select id="simulaSensi">
                    <option value="ideal">Mira Ideal (Padrão)</option>
                    <option value="peito">Grudando Peito (Aumentar Sensi)</option>
                    <option value="pina">Mira Pinando (Estabilizar)</option>
                </select>
            </div>
            <div class="row">
                <span>Alvo da Mira:</span>
                <select id="alvoPrincipal">
                    <option>Cabeça</option>
                    <option>Pescoço</option>
                </select>
            </div>
        </div>

        <div class="security-box">
            <div class="security-title">🛡️ SECURITY & STEALTH MODULE</div>
            <div class="row" style="font-size: 10px; color: var(--neon-g);">
                <span>ACTIVE ANTI-BAN ENGINE v7.3</span>
                <span style="font-weight: bold; text-shadow: 0 0 5px var(--neon-g);">ATIVADO</span>
            </div>
        </div>
    </div>

    <button class="btn-start" onclick="iniciarTudo()">▶ INICIAR FREE FIRE (STEALTH)</button>
    <div id="status-console">Aguardando injeção...</div>
    <div class="credits">Design e Código por Mércio - v8.0</div>
</div>

<script>
    async function iniciarTudo() {
        const console = document.getElementById('status-console');
        const sensi = document.getElementById('simulaSensi').value;
        const alvo = document.getElementById('alvoPrincipal').value;

        console.innerText = "> Calibrando balística inteligente...";
        console.style.color = "#ffff00";

        setTimeout(async () => {
            // Lógica Inteligente: Simula DPI/Touch
            if(sensi === "peito") {
                console.innerText = "> CAPA FÁCIL: Aumentando resposta vertical...";
            } else if(sensi === "pina") {
                console.innerText = "> ESTABILIZADO: Reduzindo dispersão de bala...";
            } else {
                console.innerText = "> CONFIGURAÇÃO IDEAL ATIVA: Foco em " + alvo.toUpperCase();
            }
            console.style.color = "#39ff14";

            // Abre o jogo (Fallback se falhar no Redmi)
            setTimeout(() => {
                // Tenta abrir o Free Fire v2026 direto
                window.location.href = "intent://#Intent;package=com.dts.freefireth;scheme=android-app;end";
                
                // Fallback para Play Store se falhar no Redmi
                setTimeout(() => {
                    window.location.href = "market://details?id=com.dts.freefireth";
                }, 1000);
            }, 1000);
        }, 1500);
    }
</script>

</body>
</html>
