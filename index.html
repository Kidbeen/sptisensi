<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beruz Sensi IA 3.0</title>
<link rel="manifest" href="manifest.json">
<style>
body{
    background:#0f172a;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    margin:0;
    padding:0;
}
h1{
    color:#22c55e;
    margin-top:20px;
}
button{
    padding:12px 20px;
    margin:8px;
    border-radius:12px;
    border:none;
    background:#22c55e;
    color:white;
    font-weight:bold;
    cursor:pointer;
}
.card{
    background:#1e293b;
    padding:15px;
    margin:15px;
    border-radius:15px;
}
select{
    padding:8px;
    border-radius:8px;
    border:none;
    margin:5px;
}
#resultado{
    margin-top:15px;
    font-weight:bold;
}
</style>
</head>
<body>

<h1>🔥 BERUZ SENSI IA 3.0 🔥</h1>

<!-- BOT SENSI -->
<div class="card" id="sensiCard">
<h2>🤖 GERADOR DE SENSI</h2>

<select id="marca">
<option>Xiaomi</option>
<option>Samsung</option>
<option>iPhone</option>
<option>Realme</option>
<option>Infinix</option>
<option>Tecno</option>
<option>Huawei</option>
<option>OPPO</option>
<option>Vivo</option>
<option>Motorola</option>
</select>

<select id="tipo">
<option>Baixa</option>
<option>Média</option>
<option>Alta</option>
</select>

<select id="estilo">
<option>Leve</option>
<option>Estabilizada</option>
</select>

<select id="dpi">
<option>Sem DPI</option>
<option>Com DPI</option>
</select>

<br>
<button onclick="gerar()">GERAR SENSI</button>

<p id="resultado"></p>
<button onclick="like()">👍 SENSI BOA</button>
</div>

<!-- BIBLIOTECA -->
<div class="card">
<h2>📚 BIBLIOTECA DE SENSI</h2>
<button onclick="alert('Sensi Freestyle')">Freestyle</button>
<button onclick="alert('Sensi Insta Player')">Insta Player</button>
<button onclick="alert('Sensi Rush')">Rush Player</button>
<button onclick="alert('Sensi Insane Drive')">Insane Drive</button>
<button onclick="alert('Sensi Pulante Play')">Pulante Play</button>
</div>

<!-- TUTORIAIS -->
<div class="card">
<h2>🎯 TUTORIAIS</h2>
<button onclick="window.open('https://youtube.com')">Método 2x</button>
<button onclick="window.open('https://youtube.com')">Drag Shot</button>
<button onclick="window.open('https://youtube.com')">Micro Puxada</button>
<button onclick="window.open('https://youtube.com')">Puxada Longa</button>
</div>

<!-- OTIMIZAR JOGO -->
<div class="card">
<h2>⚡ OTIMIZAR JOGO</h2>
<button onclick="alert('RAM Limpa')">Limpar RAM</button>
<button onclick="alert('Modo Desempenho Ativado')">Modo Desempenho</button>
<button onclick="alert('Modo FPS Ativado')">Modo FPS</button>
<button onclick="alert('Free Fire Aberto')">Abrir Free Fire</button>
</div>

<!-- BOT WHATSAPP -->
<div class="card">
<h2>💬 BOT WHATSAPP</h2>
<a href="https://wa.me/258XXXXXXXXX">
<button>FALAR COM BOT</button>
</a>
</div>

<!-- PREMIUM -->
<div class="card">
<h2>⭐ PREMIUM</h2>
<button onclick="alert('Funções VIP desbloqueadas!')">ATIVAR PREMIUM</button>
</div>

<script>
// Gerador de Sensi
function gerar(){
    let geral=Math.floor(Math.random()*200);
    let red=Math.floor(Math.random()*200);
    let x2=Math.floor(Math.random()*200);
    let x4=Math.floor(Math.random()*200);
    let awm=Math.floor(Math.random()*200);

    // Salvar sensi no localStorage
    let tipo=document.getElementById("tipo").value;
    let sensi={
        geral:geral,
        red:red,
        x2:x2,
        x4:x4,
        awm:awm
    };
    localStorage.setItem("sensi_"+tipo, JSON.stringify(sensi));

    document.getElementById("resultado").innerHTML=
    `GERAL: ${geral}<br>
    RED DOT: ${red}<br>
    2X: ${x2}<br>
    4X: ${x4}<br>
    AWM: ${awm}`;
}

// Botão Like
function like(){
    let likes=localStorage.getItem("likes");
    if(!likes) likes=0;
    likes++;
    localStorage.setItem("likes",likes);
    alert("Obrigado pelo like 👍 Total: "+likes);
}
</script>

</body>
</html>
