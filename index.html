<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linx 7s - System</title>
    <style>
        :root { --main: #7209b7; --neon: #4cc9f0; --bg: #020202; }
        body { background: var(--bg); color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .panel { width: 340px; background: linear-gradient(145deg, #0f0f0f, #1a1a1a); border: 1px solid var(--main); border-radius: 12px; padding: 20px; box-shadow: 0 0 30px rgba(114, 9, 183, 0.4); }
        
        .header { text-align: center; border-bottom: 1px solid #333; margin-bottom: 20px; padding-bottom: 10px; }
        .header h1 { font-size: 22px; color: var(--neon); text-transform: uppercase; letter-spacing: 2px; margin: 0; }
        .header span { font-size: 10px; color: var(--main); font-weight: bold; }

        .group { background: #111; padding: 12px; border-radius: 8px; margin-bottom: 15px; border-left: 3px solid var(--main); }
        label { font-size: 12px; color: #aaa; text-transform: uppercase; }

        /* Sliders */
        input[type=range] { width: 100%; accent-color: var(--neon); margin-top: 10px; }

        /* Switches */
        .row { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .switch { width: 40px; height: 20px; appearance: none; background: #333; border-radius: 20px; position: relative; cursor: pointer; transition: .3s; }
        .switch:checked { background: var(--main); }
        .switch::before { content: ''; position: absolute; width: 16px; height: 16px; background: #fff; border-radius: 50%; top: 2px; left: 2px; transition: .3s; }
        .switch:checked::before { left: 22px; }

        /* Botão */
        .btn-exe { width: 100%; padding: 15px; background: var(--main); border: none; color: #fff; font-weight: bold; border-radius: 5px; cursor: pointer; text-transform: uppercase; box-shadow: 0 5px 15px rgba(114, 9, 183, 0.4); }
        .btn-exe:active { transform: translateY(2px); }

        #log { font-size: 11px; color: #4cc9f0; margin-top: 15px; font-family: monospace; min-height: 40px; border-top: 1px solid #222; padding-top: 10px; }
    </style>
</head>
<body>

<div class="panel">
    <div class="header">
        <h1>Linx 7s</h1>
        <span>SISTEMA DE ALTA PERFORMANCE</span>
    </div>

    <div class="group">
        <label>Calibração de DPI: <span id="dv">600</span></label>
        <input type="range" min="360" max="1200" value="600" oninput="document.getElementById('dv').innerText = this.value">
    </div>

    <div class="group">
        <div class="row"><label>Regedit Mobile</label> <input type="checkbox" class="switch" id="opt1"></div>
        <div class="row"><label>Aceleração XY</label> <input type="checkbox" class="switch" id="opt2"></div>
        <div class="row"><label>No Lag Engine</label> <input type="checkbox" class="switch" id="opt3"></div>
        <div class="row"><label>Smooth Aim</label> <input type="checkbox" class="switch" id="opt4"></div>
    </div>

    <button class="btn-exe" onclick="executar()">Injetar Linx 7s</button>
    <div id="log">Status: Standby...</div>
</div>

<script>
    function executar() {
        const log = document.getElementById('log');
        const tasks = [
            "> Verificando hardware...",
            "> Otimizando resposta do touch...",
            "> Aplicando Regedit Linx 7s...",
            "> Limpando processos de fundo...",
            "> SISTEMA 100% OPERACIONAL!"
        ];
        
        let i = 0;
        let timer = setInterval(() => {
            log.innerHTML = tasks[i];
            i++;
            if(i >= tasks.length) {
                clearInterval(timer);
                // Função "funcional" para simular carga no sistema
                window.scrollTo(0, 0); 
                alert("O Linx 7s foi injetado! Não feche esta aba para manter a otimização ativa.");
            }
        }, 1000);
    }
</script>

</body>
</html>
