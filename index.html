<div id="ff-optimizer-v4" style="background: linear-gradient(135deg, #000, #1a1a1a); color: #00ffcc; font-family: 'Segoe UI', sans-serif; padding: 25px; border: 3px solid #00ffcc; border-radius: 15px;">

    <h1 style="text-align:center; text-shadow: 0 0 10px #00ffcc;">🚀 SUPREMACIA FF: GERADOR 7.0x</h1>

    <section style="background: #111; padding: 15px; border-radius: 10px; margin-bottom: 20px;">
        <h3>🎯 Configuração de Mira (Anti-Pinar)</h3>
        <label>Selecione a Intensidade do Multiplicador:</label>
        <select id="multiplier" style="width:100%; padding:10px; background:#222; color:#0ff; border:1px solid #0ff;">
            <option value="1.0">1.0x (Padrão)</option>
            <option value="2.5">2.5x (Rápida)</option>
            <option value="5.0">5.0x (Insana)</option>
            <option value="7.0">7.0x (Velocidade da Luz - Experimental)</option>
        </select>
        
        <div style="margin-top:15px;">
            <button onclick="generateGodSensi()" style="width:100%; padding:15px; background:#00ffcc; color:#000; font-weight:bold; border:none; cursor:pointer; border-radius:5px;">GERAR CONFIGURAÇÃO SUPREMA</button>
        </div>
        
        <div id="result-box" style="margin-top:15px; display:none; background:#000; padding:15px; border:1px dashed #0ff;">
            <p id="sensi-res"></p>
            <p id="dpi-res"></p>
            <p id="recoil-res" style="color:#ff00ea; font-weight:bold;"></p>
        </div>
    </section>

    <section style="background: #111; padding: 15px; border-radius: 10px;">
        <h3>🌍 World Pro-Player Library (Global)</h3>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <button onclick="getPro('Two9')" style="background:#333; color:#fff;">Two9 (Ajuste Fino)</button>
            <button onclick="getPro('White444')" style="background:#333; color:#fff;">White444 (Macro Style)</button>
            <button onclick="getPro('B4K')" style="background:#333; color:#fff;">B4K (Rei do Emulador)</button>
            <button onclick="getPro('Syoa')" style="background:#333; color:#fff;">Syoa (Indonésia)</button>
            <button onclick="getPro('Rai')" style="background:#333; color:#fff;">Rai (Tailândia)</button>
            <button onclick="getPro('Mino')" style="background:#333; color:#fff;">Mino (Latam)</button>
        </div>
        <div id="pro-info" style="margin-top:15px; font-style:italic; color:#00ffcc;"></div>
    </section>

</div>

<script>
function generateGodSensi() {
    const mult = parseFloat(document.getElementById('multiplier').value);
    const box = document.getElementById('result-box');
    box.style.display = "block";

    // Lógica para Sensi 200
    let geral = Math.min(200, Math.floor(185 * (mult / 2)));
    let redDot = Math.min(200, Math.floor(195 * (mult / 1.5)));
    let dpi = Math.floor(450 * mult);

    document.getElementById('sensi-res').innerHTML = `<strong>Sensi Jogo:</strong> Geral ${geral} | Red Dot ${redDot} | 2x: 200 | 4x: 180`;
    document.getElementById('dpi-res').innerHTML = `<strong>DPI Recomendada:</strong> ${dpi} (Ajuste nas Opções de Programador)`;
    document.getElementById('recoil-res').innerHTML = `⚙️ AJUSTE RECTO: Velocidade de cursor no 12/12 + Supressão Ativada (0.1s). Isso trava a mira na cabeça e evita o 'peito'.`;
}

function getPro(name) {
    const info = document.getElementById('pro-info');
    const db = {
        'Two9': "Sensi 200 em tudo | DPI 720 | Botão de Atirar 45% (Foco em Desert Eagle).",
        'White444': "Sensi Geral 190 | DPI 1200 | Multiplicador de Toque 1.5x (Capa Instantâneo).",
        'B4K': "Sensi 100 (Estilo clássico) | DPI 800 | Foco em estabilidade de FPS.",
        'Syoa': "Sensi 200 | DPI 600 | Especialista em SMG e movimentação rápida.",
        'Rai': "Sensi 150 | DPI 960 | Foco em Sniper (AWM sem delay).",
        'Mino': "Sensi 200 | DPI 500 | Botão de Atirar 52% (Estabilidade em AR)."
    };
    info.innerHTML = `<strong>Config de ${name}:</strong> ${db[name]}`;
}
</script>
