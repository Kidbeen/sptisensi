<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Linx 7S Ultimate - V7.3</title>
    <style>
        :root { --purple: #8a2be2; --dark: #0a0a0a; --neon: #39ff14; }
        body { background: #000; color: #fff; font-family: sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }
        
        .menu-container { width: 360px; background: var(--dark); border: 2px solid var(--purple); border-radius: 5px; display: flex; flex-direction: column; position: relative; }
        
        /* Barra de Título */
        .header { background: var(--purple); padding: 5px; font-size: 10px; display: flex; justify-content: space-between; font-weight: bold; }
        
        .main-content { display: flex; min-height: 250px; }

        /* Barra Lateral de Ícones */
        .sidebar { width: 50px; background: #1a1a1a; display: flex; flex-direction: column; align-items: center; border-right: 1px solid #333; }
        .icon-btn { padding: 15px 0; color: var(--purple); cursor: pointer; font-size: 18px; }

        /* Área de Funções */
        .options { flex: 1; padding: 15px; font-size: 12px; }
        .row { display: flex; justify-content: space-between; margin-bottom: 10px; align-items: center; }
        
        input[type="range"] { width: 100px; accent-color: var(--purple); }
        select { background: #222; color: #fff; border: 1px solid var(--purple); font-size: 10px; }

        /* Módulos de Segurança */
        .security-box { border: 1px solid var(--neon); padding: 10px; border-radius: 5px; margin-top: 10px; background: #051505; }
        .security-title { color: var(--neon); font-size: 9px; font-weight: bold; margin-bottom: 5px; }

        /* Botão Iniciar */
        .btn-start { width: 90%; margin: 10px auto; padding: 12px; background: transparent; border: 2px solid var(--neon); color: var(--neon); font-weight: bold; cursor: pointer; text-transform: uppercase; border-radius: 5px; }
        .btn-start:hover { background: var(--neon); color: #000; box-shadow: 0 0 15px var(--neon); }

        #console { font-size: 9px; color: #444; text-align: center; padding-bottom: 5px; }
    </style>
</head>
<body>

<div class="menu-container" id="painel">
    <div class="header">
        <span>▼ LINX 7S ULTIMATE - STEALTH EDITION</span>
        <span>X</span>
    </div>
